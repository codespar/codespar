services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codespar
      POSTGRES_USER: codespar
      POSTGRES_PASSWORD: codespar_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codespar"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  evolution-api:
    image: atendai/evolution-api:latest
    ports:
      - "8084:8084"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-codespar_dev_key}
    volumes:
      - evolution_data:/evolution/instances
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/"]
      interval: 10s
      timeout: 5s
      retries: 3

  core:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      DATABASE_URL: postgres://codespar:codespar_dev@postgres:5432/codespar
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: 3000
      # Public URL of THIS runtime, as GitHub and your browser reach it. The
      # container only sees "core:3000" from the inside, so it cannot infer it.
      # Required to auto-configure webhooks and the OAuth callback; see
      # .env.example. Compose interpolates these from a .env file next to this
      # compose file (the runtime itself does not read .env).
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # Boolean, default false. Leave it blank unless a reverse proxy you
      # control is the only way to reach this service and it overwrites
      # x-forwarded-* on every request; enabled, those headers are honoured
      # from any peer that can open a socket here. Boolean spellings only, a
      # hop count or an IP/CIDR list is rejected at startup. See .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Name this install announces at /.well-known/agent.json. Blank means a
      # generic default.
      AGENT_CARD_NAME: ${AGENT_CARD_NAME:-}
      ENABLE_WHATSAPP: "true"
      EVOLUTION_API_URL: http://evolution-api:8084
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-codespar_dev_key}
      EVOLUTION_INSTANCE: codespar
      WHATSAPP_WEBHOOK_PORT: "3001"
      WHATSAPP_BOT_MENTION: "@codespar"
      ENABLE_SLACK: "true"
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      ENABLE_TELEGRAM: ${ENABLE_TELEGRAM:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ENABLE_DISCORD: ${ENABLE_DISCORD:-false}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  evolution_data:
