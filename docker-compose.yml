services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codespar
      POSTGRES_USER: codespar
      POSTGRES_PASSWORD: codespar_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codespar"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      DATABASE_URL: postgres://codespar:codespar_dev@postgres:5432/codespar
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: 3000
      # Public URL of THIS runtime, as GitHub and your browser reach it. The
      # container only sees "core:3000" from the inside, so it cannot infer it.
      # Required to auto-configure webhooks and the OAuth callback; see
      # .env.example. Compose interpolates these from a .env file next to this
      # compose file (the runtime itself does not read .env).
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # Set to "true" (or a proxy IP/CIDR list) only when a reverse proxy you
      # control terminates TLS in front of this service.
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
